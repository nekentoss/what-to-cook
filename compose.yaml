services:
  web:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /app/data/recipes.db
    volumes:
      - recipe-data:/app/data
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  recipe-data:
