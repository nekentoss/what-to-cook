repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
      - id: biome
        name: Biome
        entry: node_modules/.bin/biome check
        language: system
        types: [javascript]
